<body>

  <header>

    <div class="header-right">
      <span id="save-status" style="font-size: 13px; color: #10b981; font-weight: 500;"></span>
      <span id="user-info" style="color: #64748b;">檢查登入中...</span>
      <button class="btn btn-success" onclick="exportToExcel()"><i class="fa-solid fa-file-excel"></i> 匯出 Excel</button>
      <label class="btn btn-primary" style="margin:0; cursor:pointer;">
        <i class="fa-solid fa-file-import"></i> 匯入 Excel <input type="file" id="excel-file-input" style="display:none" accept=".xlsx, .xls" onchange="importFromExcel(event)">
      </label>
      <button id="auth-btn" class="btn btn-primary">管理員登入</button>
    </div>
  </header>

  <div class="modal-overlay" id="login-modal">
    <div class="modal-box">
      <h3>管理員登入</h3>
      <input type="email" id="login-email" placeholder="請輸入管理者電子郵件" value="n1693131@gmail.com">
      <input type="password" id="login-password" placeholder="請輸入密碼">
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="toggleLoginModal(false)">取消</button>
        <button class="btn btn-primary" onclick="handleEmailLogin()">登入</button>
      </div>
    </div>
  </div>

  <div class="container">
    <div style="font-size: 13px; color: #64748b; margin-bottom: 8px;">工作表導覽列：(提示：以管理者身分登入後，**雙擊工作表分頁**可進行重新命名)</div>
    <div class="sheet-tabs-bar" id="sheet-tabs-container"></div>
    
    <div class="toolbar">
      <button class="btn btn-primary" onclick="addRow()"><i class="fa-solid fa-plus"></i> 新增列 (Row)</button>
      <button class="btn btn-danger" onclick="deleteLastRow()"><i class="fa-solid fa-trash"></i> 刪除最後一列</button>
      <button class="btn btn-primary" onclick="addColumn()"><i class="fa-solid fa-plus"></i> 新增欄位 (Column)</button>
      <button class="btn btn-danger" onclick="deleteLastColumn()"><i class="fa-solid fa-trash"></i> 刪除最後一欄</button>
    </div>

    <div class="table-container" id="table-view-container"></div>
    
    <div id="charts-container"></div>
  </div>

  <script>
    window.renderApp = function() {
      const state = window.appState;
      if (!state || !state.sheets) return;
      
      const currentSheet = state.sheets.find(s => s.id === state.currentSheetId) || state.sheets[0];
      state.currentSheetId = currentSheet.id;

      let tabsHtml = '';
      state.sheets.forEach(sheet => {
        const isActive = sheet.id === currentSheet.id ? 'active' : '';
        tabsHtml += `
          <div class="sheet-tab ${isActive}" onclick="switchSheet('${sheet.id}')" ondblclick="renameSheet('${sheet.id}')" title="雙擊可重新命名">
            <i class="fa-solid fa-table"></i> ${sheet.name}
            ${window.isAuthorizedEditor && state.sheets.length > 1 ? `<i class="fa-solid fa-xmark" onclick="event.stopPropagation(); deleteSheet('${sheet.id}')"></i>` : ''}
          </div>
        `;
      });
      tabsHtml += `<button class="btn btn-primary" style="padding: 4px 10px;" onclick="addSheet()"><i class="fa-solid fa-plus"></i> 新增工作表</button>`;
      document.getElementById('sheet-tabs-container').innerHTML = tabsHtml;

      let tableHtml = `<table><thead><tr>`;
      currentSheet.columns.forEach((col, colIdx) => {
        tableHtml += `<th>${window.isAuthorizedEditor ? `<input type="text" value="${col.title}" class="cell-input" style="font-weight:bold;" onchange="updateColTitle(${colIdx}, this.value)">` : col.title}</th>`;
      });
      tableHtml += `</tr></thead><tbody>`;

      currentSheet.data.forEach((row, rowIdx) => {
        tableHtml += `<tr>`;
        currentSheet.columns.forEach(col => {
          let val = row[col.key] !== undefined ? row[col.key] : '';
          tableHtml += `<td>${window.isAuthorizedEditor ? `<input type="text" value="${val}" class="cell-input" onchange="updateCell(${rowIdx}, '${col.key}', this.value)">` : val}</td>`;
        });
        tableHtml += `</tr>`;
      });
      tableHtml += `</tbody></table>`;
      document.getElementById('table-view-container').innerHTML = tableHtml;

      let chartsHtml = '';
      if (currentSheet.id === "s2" || currentSheet.name.includes("累計")) {
        chartsHtml += `<div class="charts-section-title"><i class="fa-solid fa-chart-line"></i> 產值同期與累積產值分析圖表 (共8張)</div><div class="charts-grid">`;
        const chartConfigs = [
          { id: 'sc1', title: '產值同期比較 (石墨)' },
          { id: 'sc2', title: '產值同期比較 (鎢鉬鈕)' },
          { id: 'sc3', title: '產值同期比較 (其他)' },
          { id: 'sc4', title: '產值同期比較 (合計)' },
          { id: 'sc5', title: '石墨累積產值' },
          { id: 'sc6', title: '鎢鉬鈕累積產值' },
          { id: 'sc7', title: '其他累積產值' },
          { id: 'sc8', title: '合計累積產值' }
        ];

        chartConfigs.forEach(cfg => {
          chartsHtml += `
            <div class="chart-page" id="export-area-${cfg.id}">
              <div class="chart-header">
                <div class="chart-title"><i class="fa-solid fa-chart-area" style="color:#2563eb;"></i> ${cfg.title}</div>
                <button class="btn btn-success" onclick="exportChartToPNG('${cfg.id}', '${cfg.title}')"><i class="fa-solid fa-download"></i> 匯出</button>
              </div>
              <div class="chart-wrapper"><canvas id="canvas-${cfg.id}"></canvas></div>
            </div>
          `;
        });
        chartsHtml += `</div>`;
      } else {
        let isCostSheet = currentSheet.columns.length > 5 || currentSheet.name.includes("刀具") || currentSheet.name.includes("成本") || currentSheet.name.includes("工作表");
        if (isCostSheet) {
          chartsHtml += `<div class="charts-section-title"><i class="fa-solid fa-chart-line"></i> ${currentSheet.name} 相關分析圖表 (共6張)</div><div class="charts-grid">`;
          const chartConfigs = [
            { id: 'c1', title: '2025/01-2026/08 鎢鉬鈕刀具費金額與佔比趨勢圖' },
            { id: 'c2', title: '2025/01~2026/08 鎢鉬鈕刀具費與成本趨勢圖' },
            { id: 'c3', title: '2025/01-2026/08 石墨刀具費金額與佔比趨勢圖' },
            { id: 'c4', title: '2025/01~2026/08 石墨刀具費與成本趨勢圖' },
            { id: 'c5', title: '2025/01-2026/08 其他刀具費金額與佔比趨勢圖' },
            { id: 'c6', title: '2025/01~2026/08 其他刀具費與成本趨勢圖' }
          ];

          chartConfigs.forEach(cfg => {
            chartsHtml += `
              <div class="chart-page" id="export-area-${cfg.id}">
                <div class="chart-header">
                  <div class="chart-title"><i class="fa-solid fa-chart-area" style="color:#2563eb;"></i> ${cfg.title}</div>
                  <button class="btn btn-success" onclick="exportChartToPNG('${cfg.id}', '${cfg.title}')"><i class="fa-solid fa-download"></i> 匯出</button>
                </div>
                <div class="chart-wrapper"><canvas id="canvas-${cfg.id}"></canvas></div>
              </div>
            `;
          });
          chartsHtml += `</div>`;
        } else {
          chartsHtml += `<div class="charts-section-title"><i class="fa-solid fa-chart-line"></i> ${currentSheet.name} 分析圖表</div><div class="charts-grid">
            <div class="chart-page" id="export-area-default">
              <div class="chart-header"><div class="chart-title"><i class="fa-solid fa-chart-bar"></i> 數據概覽圖</div></div>
              <div class="chart-wrapper"><canvas id="canvas-default"></canvas></div>
            </div>
          </div>`;
        }
      }

      document.getElementById('charts-container').innerHTML = chartsHtml;

      setTimeout(() => { 
        if (currentSheet.id === "s2" || currentSheet.name.includes("累計")) {
          buildAllEightComparisonCharts(currentSheet);
        } else {
          let isCostSheet = currentSheet.columns.length > 5 || currentSheet.name.includes("刀具") || currentSheet.name.includes("成本") || currentSheet.name.includes("工作表");
          if (isCostSheet) {
            buildAllSixCharts(currentSheet); 
          } else {
            buildDefaultChart(currentSheet);
          }
        }
      }, 100);
    };

    window.switchSheet = function(id) {
      window.appState.currentSheetId = id;
      renderApp();
    };

    window.addSheet = function() {
      if (!window.isAuthorizedEditor) { alert("需要管理者權限才能操作！"); return; }
      const name = prompt("請輸入新工作表名稱：");
      if (!name) return;
      const newId = 's_' + Date.now();
      window.appState.sheets.push({
        id: newId,
        name: name,
        columns: [{ key: "category", title: "類別" }, { key: "m1", title: "Jan-26" }, { key: "m2", title: "Feb-26" }],
        data: [{ category: "範例項目", m1: 100, m2: 200 }]
      });
      window.appState.currentSheetId = newId;
      renderApp();
      window.autoSaveToFirebase();
    };

    window.renameSheet = function(id) {
      if (!window.isAuthorizedEditor) { alert("需要管理者權限！"); return; }
      const sheet = window.appState.sheets.find(s => s.id === id);
      if (!sheet) return;
      const newName = prompt("請輸入新的工作表名稱：", sheet.name);
      if (newName && newName.trim() !== "") {
        sheet.name = newName.trim();
        renderApp();
        window.autoSaveToFirebase();
      }
    };

    window.deleteSheet = function(id) {
      if (!window.isAuthorizedEditor) return;
      if (window.appState.sheets.length <= 1) { alert("至少需保留一個工作表！"); return; }
      if (confirm("確定要刪除此工作表嗎？")) {
        window.appState.sheets = window.appState.sheets.filter(s => s.id !== id);
        window.appState.currentSheetId = window.appState.sheets[0].id;
        renderApp();
        window.autoSaveToFirebase();
      }
    };

    window.addRow = function() {
      if (!window.isAuthorizedEditor) { alert("需要管理者權限！"); return; }
      const sheet = window.appState.sheets.find(s => s.id === window.appState.currentSheetId);
      let newRow = {};
      sheet.columns.forEach((c, idx) => newRow[c.key] = idx === 0 ? '新項目' : 0);
      sheet.data.push(newRow);
      renderApp();
      window.autoSaveToFirebase();
    };

    window.deleteLastRow = function() {
      if (!window.isAuthorizedEditor) return;
      const sheet = window.appState.sheets.find(s => s.id === window.appState.currentSheetId);
      if (sheet.data.length > 0) { 
        sheet.data.pop(); 
        renderApp(); 
        window.autoSaveToFirebase();
      }
    };

    window.addColumn = function() {
      if (!window.isAuthorizedEditor) { alert("需要管理者權限！"); return; }
      const sheet = window.appState.sheets.find(s => s.id === window.appState.currentSheetId);
      const colTitle = prompt("請輸入新欄位標題 (例: Sep-26)：");
      if (!colTitle) return;
      const colKey = 'col_' + Date.now();
      sheet.columns.push({ key: colKey, title: colTitle });
      sheet.data.forEach(r => r[colKey] = 0);
      renderApp();
      window.autoSaveToFirebase();
    };

    window.deleteLastColumn = function() {
      if (!window.isAuthorizedEditor) return;
      const sheet = window.appState.sheets.find(s => s.id === window.appState.currentSheetId);
      if (sheet.columns.length > 1) {
        const removed = sheet.columns.pop();
        sheet.data.forEach(r => delete r[removed.key]);
        renderApp();
        window.autoSaveToFirebase();
      } else {
        alert("至少需保留一個欄位！");
      }
    };

    window.updateCell = function(rowIdx, key, val) {
      if (!window.isAuthorizedEditor) return;
      const sheet = window.appState.sheets.find(s => s.id === window.appState.currentSheetId);
      sheet.data[rowIdx][key] = val;
      window.autoSaveToFirebase();
    };

    window.updateColTitle = function(colIdx, val) {
      if (!window.isAuthorizedEditor) return;
      const sheet = window.appState.sheets.find(s => s.id === window.appState.currentSheetId);
      sheet.columns[colIdx].title = val;
      window.autoSaveToFirebase();
    };

    window.exportToExcel = function() {
      const wb = XLSX.utils.book_new();
      window.appState.sheets.forEach(sheet => {
        const exportData = sheet.data.map(row => {
          let obj = {};
          sheet.columns.forEach(col => { obj[col.title] = row[col.key]; });
          return obj;
        });
        const ws = XLSX.utils.json_to_sheet(exportData);
        XLSX.utils.book_append_sheet(wb, ws, sheet.name);
      });
      XLSX.writeFile(wb, "MFG_Output_Analysis.xlsx");
    };

    window.importFromExcel = async function(event) {
      if (!window.isAuthorizedEditor) { alert("需要管理者權限才能匯入！"); return; }
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async function(e) {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        
        const sheetName = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[sheetName];
        const json = XLSX.utils.sheet_to_json(worksheet);
        
        if (json.length > 0) {
          const keys = Object.keys(json[0]);
          const columns = keys.map((k, i) => ({ key: i === 0 ? 'category' : `m${i}`, title: k }));
          const sheetData = json.map(row => {
            let rObj = {};
            keys.forEach((k, i) => { rObj[columns[i].key] = row[k]; });
            return rObj;
          });

          const currentSheet = window.appState.sheets.find(s => s.id === window.appState.currentSheetId) || window.appState.sheets[0];
          currentSheet.columns = columns;
          currentSheet.data = sheetData;
          
          renderApp();
          window.autoSaveToFirebase();
          alert("Excel 匯入成功，並已自動同步儲存至 Firebase！");
        }
      };
      reader.readAsArrayBuffer(file);
    };

    function parseNum(val) {
      if (val === undefined || val === null || val === '') return 0;
      let s = String(val).replace(/[^0-9.-]/g, '');
      let n = parseFloat(s);
      return isNaN(n) ? 0 : n;
    }

    window.chartInstances = {};

    function buildAllEightComparisonCharts(sheet) {
      const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      const materials = ["石墨", "鎢鉬鈕", "其他"];

      const getMaterialRows = (mat) => {
        return sheet.data.filter(r => String(r.material || '').trim() === mat);
      };

      const getCombinedRows = () => {
        let combined = [];
        months.forEach((m, idx) => {
          let rowObj = { month: m, y2023: 0, y2024: 0, y2025: 0, y2026: 0 };
          materials.forEach(mat => {
            let mRows = getMaterialRows(mat);
            let target = mRows[idx];
            if (target) {
              rowObj.y2023 += parseNum(target.y2023);
              rowObj.y2024 += parseNum(target.y2024);
              rowObj.y2025 += parseNum(target.y2025);
              rowObj.y2026 += parseNum(target.y2026);
            }
          });
          combined.push(rowObj);
        });
        return combined;
      };

      // 1-4: 產值同期比較 (柱狀圖)
      materials.forEach((mat, idx) => {
        let rows = getMaterialRows(mat);
        drawBarComparisonChart(`sc${idx+1}`, rows, `${mat}產值同期比較`);
      });
      // 合計同期比較
      drawBarComparisonChart('sc4', getCombinedRows(), '合計產值同期比較');

      // 5-8: 累積產值 (折線圖)
      materials.forEach((mat, idx) => {
        let rows = getMaterialRows(mat);
        drawCumulativeLineChart(`sc${idx+5}`, rows, `${mat}累積產值`);
      });
      // 合計累積產值
      drawCumulativeLineChart('sc8', getCombinedRows(), '合計累積產值');
    }

    function drawBarComparisonChart(chartId, rows, titleText) {
      const canvas = document.getElementById(`canvas-${chartId}`);
      if (!canvas) return;
      if (window.chartInstances[chartId]) window.chartInstances[chartId].destroy();

      const labels = rows.map(r => r.month);
      window.chartInstances[chartId] = new Chart(canvas, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [
            { label: '2023', data: rows.map(r => parseNum(r.y2023)), backgroundColor: '#10b981' },
            { label: '2024', data: rows.map(r => parseNum(r.y2024)), backgroundColor: '#3b82f6' },
            { label: '2025', data: rows.map(r => parseNum(r.y2025)), backgroundColor: '#f59e0b' },
            { label: '2026', data: rows.map(r => parseNum(r.y2026)), backgroundColor: '#ef4444' }
          ]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          scales: {
            x: { grid: { display: false } },
            y: { title: { display: true, text: 'NT$' } }
          }
        }
      });
    }

    function drawCumulativeLineChart(chartId, rows, titleText) {
      const canvas = document.getElementById(`canvas-${chartId}`);
      if (!canvas) return;
      if (window.chartInstances[chartId]) window.chartInstances[chartId].destroy();

      const labels = rows.map(r => r.month);
      
      // 計算累加數值
      let sum23 = 0, sum24 = 0, sum25 = 0, sum26 = 0;
      let data23 = rows.map(r => sum23 += parseNum(r.y2023));
      let data24 = rows.map(r => sum24 += parseNum(r.y2024));
      let data25 = rows.map(r => sum25 += parseNum(r.y2025));
      let data26 = rows.map(r => sum26 += parseNum(r.y2026));

      window.chartInstances[chartId] = new Chart(canvas, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [
            { label: '2023', data: data23, borderColor: '#10b981', backgroundColor: '#10b981', tension: 0.2, pointRadius: 3 },
            { label: '2024', data: data24, borderColor: '#3b82f6', backgroundColor: '#3b82f6', tension: 0.2, pointRadius: 3 },
            { label: '2025', data: data25, borderColor: '#f59e0b', backgroundColor: '#f59e0b', tension: 0.2, pointRadius: 3 },
            { label: '2026', data: data26, borderColor: '#ef4444', backgroundColor: '#ef4444', tension: 0.2, pointRadius: 3 }
          ]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          scales: {
            x: { grid: { display: false } },
            y: { title: { display: true, text: 'NT$' } }
          }
        }
      });
    }

    function buildAllSixCharts(sheet) {
      const monthCols = sheet.columns.filter(c => {
        let t = String(c.title || '').trim();
        return t.includes('-') || t.includes('25') || t.includes('26');
      });
      const finalMonthCols = monthCols.length > 0 ? monthCols : sheet.columns.slice(1);
      const labels = finalMonthCols.map(c => c.title);
      const catKey = sheet.columns[0].key;

      const findRow = (kw1, kw2) => {
        return sheet.data.find(r => {
          let val = String(r[catKey] || '').trim();
          if (kw2) { return val.includes(kw1) && val.includes(kw2); }
          return val.includes(kw1);
        });
      };

      const getValues = (row) => row ? finalMonthCols.map(c => parseNum(row[c.key])) : labels.map(() => 0);
      const getRatioValues = (row) => row ? finalMonthCols.map(c => {
        let v = String(row[c.key] || '0').replace('%','');
        let n = parseFloat(v);
        return isNaN(n) ? 0 : (n <= 1 ? n * 100 : n);
      }) : labels.map(() => 0);

      const tungFee = findRow("鎢", "刀具") || findRow("鎢鉬", "費") || sheet.data[0];
      const tungCost = findRow("鎢", "成本") || findRow("鎢鉬", "成本") || sheet.data[1];
      const tungRatio = findRow("鎢", "佔比") || findRow("鎢鉬", "佔比") || sheet.data[2];

      const graphFee = findRow("石墨", "刀具") || findRow("石墨", "費") || sheet.data[3];
      const graphCost = findRow("石墨", "成本") || sheet.data[4];
      const graphRatio = findRow("石墨", "佔比") || sheet.data[5];

      const otherFee = findRow("其他", "刀具") || findRow("其他", "費") || sheet.data[6];
      const otherCost = findRow("其他", "成本") || sheet.data[7];
      const otherRatio = findRow("其他", "佔比") || sheet.data[8];

      drawBarLineChartWithCustomScale('c1', labels, getValues(tungFee), getRatioValues(tungRatio), '鎢鉬鈕刀具費', '佔比 (%)', 2000000, 5, 'y', 'y1');
      drawDoubleLineChart('c2', labels, getValues(tungFee), getValues(tungCost), '鎢鉬鈕刀具費', '鎢鉬產品成本');
      
      drawBarLineChartWithCustomScale('c3', labels, getValues(graphFee), getRatioValues(graphRatio), '石墨刀具費', '佔比 (%)', 700000, 7, 'y', 'y1');
      drawDoubleLineChart('c4', labels, getValues(graphFee), getValues(graphCost), '石墨刀具費', '石墨產品成本');

      drawBarLineChartWithCustomScale('c5', labels, getValues(otherFee), getRatioValues(otherRatio), '其他刀具費', '佔比 (%)', 900000, 2, 'y', 'y1');
      drawDoubleLineChart('c6', labels, getValues(otherFee), getValues(otherCost), '其他刀具費', '其他產品成本');
    }

    function buildDefaultChart(sheet) {
      const canvas = document.getElementById('canvas-default');
      if (!canvas) return;
      if (window.chartInstances['default']) window.chartInstances['default'].destroy();
      const labels = sheet.data.map(r => r[sheet.columns[0].key] || '');
      const valCol = sheet.columns[1];
      window.chartInstances['default'] = new Chart(canvas, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{ label: valCol ? valCol.title : '數值', data: sheet.data.map(r => parseNum(r[valCol?.key])), backgroundColor: 'rgba(59, 130, 246, 0.7)' }]
        },
        options: { responsive: true, maintainAspectRatio: false }
      });
    }

    function drawBarLineChartWithCustomScale(chartId, labels, barData, lineData, barLabel, lineLabel, maxVal, maxRatio, yId, y1Id) {
      const canvas = document.getElementById(`canvas-${chartId}`);
      if (!canvas) return;
      if (window.chartInstances[chartId]) window.chartInstances[chartId].destroy();

      window.chartInstances[chartId] = new Chart(canvas, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [
            { type: 'bar', label: barLabel, data: barData, backgroundColor: '#94a3b8', yAxisID: yId, order: 2 },
            { type: 'line', label: lineLabel, data: lineData, borderColor: '#ef4444', backgroundColor: '#ef4444', yAxisID: y1Id, borderWidth: 2.5, tension: 0.2, pointRadius: 4, order: 1 }
          ]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          scales: {
            x: { grid: { display: false } },
            y: { 
              type: 'linear', 
              position: 'left', 
              max: maxVal,
              ticks: { stepSize: maxVal / 8 },
              title: { display: true, text: '金額 (NT$)' } 
            },
            y1: { 
              type: 'linear', 
              position: 'right', 
              max: maxRatio,
              ticks: { 
                stepSize: maxRatio / 7,
                callback: function(v) { return Math.round(v) + '%'; } 
              }, 
              grid: { drawOnChartArea: false }, 
              title: { display: true, text: '佔比 (%)' } 
            }
          }
        }
      });
    }

    function drawDoubleLineChart(chartId, labels, line1Data, line2Data, line1Label, line2Label) {
      const canvas = document.getElementById(`canvas-${chartId}`);
      if (!canvas) return;
      if (window.chartInstances[chartId]) window.chartInstances[chartId].destroy();

      window.chartInstances[chartId] = new Chart(canvas, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [
            { type: 'line', label: line1Label, data: line1Data, borderColor: '#2563eb', backgroundColor: '#2563eb', yAxisID: 'y', borderWidth: 2, tension: 0.2, pointRadius: 3 },
            { type: 'line', label: line2Label, data: line2Data, borderColor: '#8b5cf6', backgroundColor: '#8b5cf6', yAxisID: 'y1', borderWidth: 2, tension: 0.2, pointRadius: 3 }
          ]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          scales: {
            x: { grid: { display: false } },
            y: { type: 'linear', position: 'left', title: { display: true, text: '刀具費 (NT$)' } },
            y1: { type: 'linear', position: 'right', grid: { drawOnChartArea: false }, title: { display: true, text: '產品成本 (NT$)' } }
          }
        }
      });
    }

    window.exportChartToPNG = function(chartId, title) {
      const element = document.getElementById(`export-area-${chartId}`);
      if (!element) return;
      html2canvas(element, { scale: 2 }).then(canvas => {
        const link = document.createElement('a');
        link.download = `${title}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      }).catch(() => alert("匯出圖片失敗！"));
    };
  </script>
</body>
</html>
